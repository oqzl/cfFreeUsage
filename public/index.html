<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f3">
  <title>cfFreeUsage</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">CLOUDFLARE FREE TIER</p>
        <h1>cfFreeUsage</h1>
        <p class="subtitle">Account-wide usage against the limits that can stop free-tier workloads.</p>
      </div>
      <button id="refresh" type="button">Refresh</button>
    </header>

    <section class="statusbar" aria-live="polite">
      <span id="status">Loading…</span>
      <span id="updated"></span>
    </section>

    <section id="dashboard" class="dashboard"></section>

    <footer>
      Daily limits reset at 00:00 UTC. R2 limits reset monthly. Analytics can lag behind live traffic.
    </footer>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
